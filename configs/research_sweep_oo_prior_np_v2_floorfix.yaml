# ============================================================================
# OO Prior Probe v2 - NP Monotonic (Empirical Floor Fix)
# ============================================================================
# Tests the empirical-prior floor fix in inference.py.
# Key change: empirical_prior_floor is set very low so "empirical" reflects the
# observed OO baseline instead of being pinned at p=0.01.
# ============================================================================
name: "research_sweep_oo_prior_np_v2_floorfix"

source: "oo"
wandb_enabled: false
oo:
  sim_id: 165
  backbone_method: "disparity"
  backbone_threshold: 0.3
  kmax: 20

model:
  stan_file: "src/models/non_parametric_monotonic_empirical_bayes.stan"
  K: 1
  concentration: 1.0
  deviation_scale: 0.5
  logit_p_location: "empirical"
  logit_p_scale: 1.2
  empirical_prior_floor: 0.000001
  empirical_prior_cap: 0.999999
  V_max_local: 1000

sweep:
  K: [1, 2]
  stan_file:
    - "src/models/non_parametric_monotonic_empirical_bayes.stan"
  concentration: [0.5, 1.0]
  logit_p_location: ["empirical", -5.6]
  logit_p_scale: [1.2]
