# ============================================================================
# Retry Sweep - Twitter SC survival with tighter priors (K=1 only)
# ============================================================================
name: "research_sweep_twitter_optimal_q_sc_survival_retry"

data_config: "configs/default_data_prep_survival.yaml"
source: "twitter"
twitter_mn_mode: "survival"
wandb_enabled: false

# Fixed data parameters for SC
q: 0.192
exposure_metric: "k"

model:
  stan_file: "src/models/non_parametric_monotonic.stan"
  K: 1
  concentration: 1.0

  # Tighter regularization for low-prevalence survival framing
  deviation_scale: 2.0
  logit_p_location: -7.8
  logit_p_scale: 1.5
  logit_rho_location: -8.8
  logit_rho_scale: 1.5
  logit_rho_l_location: -10.5
  logit_rho_l_scale: 1.0
  logit_rho_h_location: -7.8
  logit_rho_h_scale: 0.8
  w_rate: 2.0
  k0_location: 10.0
  k0_scale: 2.5
  V_max_local: 500

sweep:
  K: [1]
  stan_file: [
    "src/models/non_parametric_monotonic.stan",
    "src/models/model_simple_contagion.stan",
    "src/models/model_complex_contagion.stan"
  ]
