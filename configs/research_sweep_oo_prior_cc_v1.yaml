# ============================================================================
# OO Prior Probe v1 - Complex Contagion
# ============================================================================
# Hypothesis:
#   CC underfit is driven by conservative asymptote + late sigmoid midpoint.
#   We sweep rho_h and k0 priors to allow earlier, higher growth over k=1..20.
# ============================================================================
name: "research_sweep_oo_prior_cc_v1"

source: "oo"
wandb_enabled: false
oo:
  sim_id: 165
  backbone_method: "disparity"
  backbone_threshold: 0.3
  kmax: 20

model:
  stan_file: "src/models/model_complex_contagion.stan"
  K: 1
  deviation_scale: 1.0
  logit_rho_l_location: -9.0
  logit_rho_l_scale: 1.0
  logit_rho_h_location: -5.0
  logit_rho_h_scale: 1.2
  w_rate: 0.5
  k0_location: 10.0
  k0_scale: 6.0
  V_max_local: 1000

sweep:
  K: [1]
  stan_file:
    - "src/models/model_complex_contagion.stan"
  logit_rho_h_location: [-6.0, -5.5, -5.0, -4.5]
  k0_location: [8.0, 10.0, 12.0]
  k0_scale: [4.0, 6.0]
