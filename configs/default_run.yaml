# ============================================================================
# Default Run Config
# ============================================================================
# Matches defaults in Snakefile/inference.smk
# ============================================================================

name: "default_run"
data_config: "configs/default_data_prep.yaml"

# Define the sweep manually if not using the 'sweep' key feature logic
# For default_run, we usually just want one model
model:
    stan_file: "src/models/non_parametric_monotonic.stan"
    K: 1
    V_max_local: 10000 # Increased for better scale recovery
    deviation_scale: 1.0
    logit_p_location: "empirical"
    logit_p_scale: 2.0
