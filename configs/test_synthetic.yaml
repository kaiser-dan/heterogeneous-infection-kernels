# ============================================================================
# Minimal Synthetic Config for CI / End-to-End Testing
# ============================================================================
# Small graph, single simulation instance, single inference model.
# Designed to run in under a few minutes on any machine with no raw data.
# ============================================================================
name: "test_synthetic"
source: "synthetic"
wandb_enabled: false

synthetic:
  dataset_name: "test_sim"
  seed: 42
  kmax: 5
  graph:
    type: "er"
    params:
      n: 40
      avg_degree: 4
  contagion:
    gamma: 0.1
    tmax: 100
    dt: 1
    initial_infected: 0.1
    assignment:
      mode: "iid"
      probs: [0.5, 0.5]
    kernels:
      - id: "k1"
        type: "simple"
        beta: 0.05
      - id: "k2"
        type: "simple"
        beta: 0.15

model:
  stan_file: "src/models/model_simple_contagion.stan"
  K: 1
  deviation_scale: 1.0
  logit_p_location: "empirical"
  logit_p_scale: 2.0
  V_max_local: 1000

sweep:
  K: [1]
  stan_file: ["src/models/model_simple_contagion.stan"]
