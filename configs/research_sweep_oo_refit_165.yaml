# ============================================================================
# Research Sweep - Operation Outbreak (Sim 165) Refit
# ============================================================================
# Re-run the core comparison set:
#   - Simple contagion
#   - Complex contagion
#   - Non-parametric monotonic empirical Bayes
# across K = 1, 2.
# ============================================================================
name: "research_sweep_oo_refit_165"

source: "oo"
oo:
  sim_id: 165
  backbone_method: "disparity"
  backbone_threshold: 0.3
  kmax: 20

model:
  stan_file: "src/models/non_parametric_monotonic_empirical_bayes.stan"
  K: 1
  concentration: 1.0
  deviation_scale: 1.0
  logit_p_location: "empirical"
  logit_p_scale: 2.0
  logit_rho_location: -10.0
  logit_rho_scale: 2.0
  logit_rho_l_location: -10.0
  logit_rho_l_scale: 2.0
  logit_rho_h_location: -6.0
  logit_rho_h_scale: 2.5
  V_max_local: 1000

sweep:
  K: [1, 2]
  stan_file:
    - "src/models/model_simple_contagion.stan"
    - "src/models/model_complex_contagion.stan"
    - "src/models/non_parametric_monotonic_empirical_bayes.stan"
