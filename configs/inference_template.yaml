# ============================================================================
# INFERENCE CONFIGURATION TEMPLATE
# ============================================================================
# This config specifies:
#   1. Which dataset to use (Operation Outbreak or Twitter)
#   2. Which models to fit
#   3. Stan hyperparameters for each model
# ============================================================================

name: "example_inference"  # Name for this inference run

# ----------------------------------------------------------------------------
# DATA CONFIGURATION
# ----------------------------------------------------------------------------
data:
  # Source: "twitter" or "oo" (Operation Outbreak)
  source: "twitter"

  # === TWITTER-SPECIFIC OPTIONS ===
  twitter:
    # Interventions: list of specific interventions, or "ALL" to aggregate
    # Options: ['getyourflushot', 'highfiveastranger', 'somethinggood', ...]
    # or: "ALL"
    interventions: "ALL"

    # Smoothing parameter q (0.0 to 1.0)
    q: 1.0

    # Metric: "k" (total exposures) or "kappa" (unique sources)
    metric: "k"

    # If interventions == "ALL", aggregate strategy:
    # "sum" - sum M and N across interventions for each user (default)
    # "concat" - concatenate users from all interventions (no aggregation)
    aggregation: "sum"

  # === OPERATION OUTBREAK-SPECIFIC OPTIONS ===
  oo:
    # Simulation ID (e.g., 118, 131, 165)
    sim_id: 165

    # Backbone method
    backbone_method: "metric_distance_backbone"

    # Maximum exposure level
    kmax: 20

# ----------------------------------------------------------------------------
# MODELS TO FIT
# ----------------------------------------------------------------------------
# Each model entry specifies:
#   - stan_file: path to .stan model
#   - data: Stan data parameters (hyperparameters)
#   - sampling: MCMC sampling parameters
# ----------------------------------------------------------------------------
models:
  # Non-Parametric Monotonic (with Empirical Bayes)
  - name: "np_monotonic_K1"
    stan_file: "src/models/non_parametric_monotonic.stan"
    data:
      K: 1
      CONCENTRATION: 1.0
      DEVIATION_SCALE: 1.0
      # Empirical Bayes: compute from data
      # Set to "empirical" to auto-compute from low-k data
      # Or set to a specific float value (e.g., -9.0)
      LOGIT_P_LOCATION: "empirical"
      LOGIT_P_SCALE: 2.0  # 1.0=strong, 2.0=moderate, 3.0=weak
    sampling:
      chains: 4
      iter_warmup: 500
      iter_sampling: 500
      adapt_delta: 0.95

  # Non-Parametric Non-Monotonic
  - name: "np_non_monotonic_K1"
    stan_file: "src/models/non_parametric_non_monotonic.stan"
    data:
      K: 1
      CONCENTRATION: 1.0
      DEVIATION_SCALE: [1.0]  # List for non-monotonic
    sampling:
      chains: 4
      iter_warmup: 500
      iter_sampling: 500
      adapt_delta: 0.95

  # Parametric Simple Contagion
  - name: "simple_contagion"
    stan_file: "src/models/model_simple_contagion.stan"
    data: {}  # No hyperparameters needed
    sampling:
      chains: 4
      iter_warmup: 500
      iter_sampling: 500
      adapt_delta: 0.8

  # Parametric Complex Contagion
  - name: "complex_contagion"
    stan_file: "src/models/model_complex_contagion.stan"
    data: {}
    sampling:
      chains: 4
      iter_warmup: 500
      iter_sampling: 500
      adapt_delta: 0.8

# ----------------------------------------------------------------------------
# OUTPUT CONFIGURATION
# ----------------------------------------------------------------------------
output:
  # Base directory for results
  results_dir: "results"

  # Save options
  save_draws: true
  save_summary: true
  save_diagnostics: true

  # Compression
  compress: true  # Use parquet compression

# ----------------------------------------------------------------------------
# EXAMPLE CONFIGURATIONS
# ----------------------------------------------------------------------------

# Example 1: Fit all models to Twitter data (all interventions, q=1.0, k metric)
# data:
#   source: "twitter"
#   twitter:
#     interventions: "ALL"
#     q: 1.0
#     metric: "k"
#     aggregation: "sum"

# Example 2: Fit to specific Twitter intervention
# data:
#   source: "twitter"
#   twitter:
#     interventions: ["getyourflushot"]
#     q: 0.2
#     metric: "kappa"
#     aggregation: "sum"

# Example 3: Fit to Operation Outbreak sim 165
# data:
#   source: "oo"
#   oo:
#     sim_id: 165
#     backbone_method: "metric_distance_backbone"
#     kmax: 20
