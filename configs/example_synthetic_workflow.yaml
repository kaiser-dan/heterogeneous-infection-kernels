name: "example_synthetic_workflow"
source: "synthetic"
wandb_enabled: false

synthetic:
  dataset_name: "readme_synthetic_smoke"
  seed: 11
  kmax: 12
  graph:
    type: "sbm"
    params:
      n: 48
      avg_degree: 8
      epsilon: 0.7
  contagion:
    gamma: 0.1
    tmax: 80
    dt: 1
    initial_infected: 0.15
    assignment:
      mode: "iid"
      probs: [1.0]
    kernels:
      - id: "k1"
        type: "simple"
        beta: 0.08

model:
  stan_file: "src/models/model_simple_contagion.stan"
  K: 1
  sampling:
    chains: 1
    iter_warmup: 25
    iter_sampling: 25
    adapt_delta: 0.8

output:
  posterior_mode: "minimal"
