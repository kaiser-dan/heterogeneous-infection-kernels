# ============================================================================
# Twitter Full Data - Empirical Bayes NP Models
# ============================================================================
# Fits NP models with data-informed priors to fix prior domination issue
# ============================================================================

name: "twitter_full_empirical_bayes"

data:
  source: "twitter"
  twitter:
    interventions: "ALL"  # Aggregate all 8 interventions
    q: 1.0  # No smoothing
    metric: "k"  # Total exposures
    aggregation: "sum"  # Sum M and N across interventions per user

models:
  # Non-Parametric Monotonic with Empirical Bayes
  - name: "monotonic_K1_empirical"
    stan_file: "src/models/non_parametric_monotonic.stan"
    data:
      K: 1
      CONCENTRATION: 1.0
      DEVIATION_SCALE: 1.0
      LOGIT_P_LOCATION: "empirical"  # Auto-compute from data
      LOGIT_P_SCALE: 2.0  # Moderate uncertainty
    sampling:
      chains: 4
      iter_warmup: 500
      iter_sampling: 500
      adapt_delta: 0.95
      max_treedepth: 12

output:
  results_dir: "results/twitter_full_k_q1.0_empirical_bayes"
  save_draws: true
  save_summary: true
  save_diagnostics: true
  compress: true
