# ============================================================================
# OO Prior Probe v3 - NP Monotonic (Drop Zero-Exposure Bin)
# ============================================================================
# Hypothesis:
#   The k=0 exposure bin dominates the likelihood and drags fitted kernels down.
#   This sweep repeats the v1 prior grid while dropping bin 0 before fitting.
# ============================================================================
name: "research_sweep_oo_prior_np_v3_dropzero"

source: "oo"
wandb_enabled: false
oo:
  sim_id: 165
  backbone_method: "disparity"
  backbone_threshold: 0.3
  kmax: 20

model:
  stan_file: "src/models/non_parametric_monotonic_empirical_bayes.stan"
  K: 2
  concentration: 1.0
  deviation_scale: 1.0
  logit_p_location: -5.6
  logit_p_scale: 0.8
  empirical_prior_floor: 0.000001
  empirical_prior_cap: 0.999999
  drop_zero_exposure_bin: true
  V_max_local: 1000

sweep:
  K: [1, 2]
  stan_file:
    - "src/models/non_parametric_monotonic_empirical_bayes.stan"
  concentration: [0.5, 1.0]
  deviation_scale: [0.5, 1.0]
  logit_p_location: ["empirical", -5.6, -5.0]
  logit_p_scale: [0.8, 1.2]
  drop_zero_exposure_bin: [true]

