# ============================================================================
# Research Sweep - Twitter Full Data
# ============================================================================
name: "research_sweep_twitter"

data_config: "configs/default_data_prep.yaml"
source: "twitter"
wandb_enabled: false

model:
  stan_file: "src/models/non_parametric_monotonic.stan"
  K: 1
  concentration: 1.0
  deviation_scale: 1.0
  # NP monotonic: logit-Normal prior on saturation parameter p
  logit_p_location: -7.5   # median p ≈ 0.00055, 95% CI: [1.1e-5, 0.027]
  logit_p_scale: 2.0
  # SC: logit-Normal prior on per-contact infection probability rho
  logit_rho_location: -10.0  # median rho ≈ 4.5e-5, 95% CI: [9e-7, 0.0023]
  logit_rho_scale: 2.0
  # CC: logit-Normal priors on sigmoid asymptotes
  logit_rho_l_location: -10.0  # floor, median ≈ 4.5e-5
  logit_rho_l_scale: 2.0
  logit_rho_h_location: -6.0   # ceiling, median ≈ 0.0025, 95% CI: [1.8e-5, 0.25]
  logit_rho_h_scale: 2.5
  V_max_local: 500

sweep:
  # Dataset variants
  q: [1.0, 0.2]
  exposure_metric: ["k", "kappa"]

  # Model variants
  K: [1, 2]
  stan_file: [
    "src/models/non_parametric_monotonic.stan",
    "src/models/model_simple_contagion.stan",
    "src/models/model_complex_contagion.stan"
  ]
