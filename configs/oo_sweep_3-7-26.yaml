# ============================================================================
# OO Sim 165 Sweep - 3 Standardized Mixture Models x K=[1,2] x 2 Prior Regimes
# 12 total runs: 3 models x 2 K values x 2 prior regimes (EB + WEAK)
# Uses kmax=30 (kmax=20 had boundary artifact)
# ============================================================================
#
# Prior regimes are handled via SLURM array: tasks 0-5 use EB config,
# tasks 6-11 use WEAK config. Each config sweeps over K x stan_file (6 combos).
#
# This file defines the EB regime. The WEAK regime is in oo_sweep_3-7-26_weak.yaml.
# Both are dispatched by the SLURM script scripts/oo_sweep_3-7-26.sh.

name: "oo_sweep_3-7-26_eb"

source: "oo"
oo:
  sim_id: 165
  backbone_method: "disparity"
  backbone_threshold: 0.3
  kmax: 30
  drop_zero_exposure_bin: true
  data_path: "data/processed/oo/sim_165_backbone_disparity_kmax30"

model:
  stan_file: "src/models/mixture_non_parametric.stan"
  K: 1

  # Shared standardized priors
  sigma_scale: 1.0
  pi_concentration: 1.0

  # Empirical Bayes location resolvers
  empirical_floor_levels: 3
  empirical_ceiling_levels: 4
  empirical_prior_floor: 1.0e-6
  empirical_prior_cap: 0.999999

  # SC priors
  logit_rho_location: "empirical_floor"
  logit_rho_scale: 2.0

  # CC priors
  logit_rho_l_location: "empirical_floor"
  logit_rho_l_scale: 2.0
  logit_rho_h_location: "empirical_ceiling"
  logit_rho_h_scale: 2.0
  w_rate: 0.5
  k0_location: 10.0
  k0_scale: 5.0

  # NP priors
  logit_mu_location: "empirical"
  logit_mu_scale: 2.0

  sampling:
    chains: 1
    iter_warmup: 500
    iter_sampling: 500
    adapt_delta: 0.95

sweep:
  K: [1, 2]
  stan_file: [
    "src/models/mixture_simple_contagion.stan",
    "src/models/mixture_complex_contagion.stan",
    "src/models/mixture_non_parametric.stan"
  ]
