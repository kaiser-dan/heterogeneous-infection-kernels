# ============================================================================
# Research Sweep - Twitter Full Data at Optimal q Values (CC)
# ============================================================================
# Complex Contagion: q=0.18, metric=kappa
# See research_sweep_twitter_optimal_q.yaml for SC counterpart.
# ============================================================================
name: "research_sweep_twitter_optimal_q_cc"

data_config: "configs/default_data_prep.yaml"
source: "twitter"
wandb_enabled: false

# Fixed data parameters for CC
q: 0.18
exposure_metric: "kappa"

model:
  stan_file: "src/models/non_parametric_monotonic_empirical_bayes.stan"
  K: 1
  concentration: 1.0
  deviation_scale: 1.0
  logit_p_location: "empirical"
  logit_p_scale: 2.0
  V_max_local: 500

sweep:
  K: [1, 2]
  stan_file: [
    "src/models/non_parametric_non_monotonic.stan",
    "src/models/model_simple_contagion.stan",
    "src/models/model_complex_contagion.stan"
  ]
