# ============================================================================
# OO Sim 165 Sweep - Weak Non-EB Priors (companion to oo_sweep_3-7-26.yaml)
# 6 runs: 3 models x K=[1,2]
# Uses kmax=30 (kmax=20 had boundary artifact)
# ============================================================================

name: "oo_sweep_3-7-26_weak"

source: "oo"
oo:
  sim_id: 165
  backbone_method: "disparity"
  backbone_threshold: 0.3
  kmax: 30
  drop_zero_exposure_bin: true
  data_path: "data/processed/oo/sim_165_backbone_disparity_kmax30"

model:
  stan_file: "src/models/mixture_non_parametric.stan"
  K: 1

  # Shared standardized priors
  sigma_scale: 1.0
  pi_concentration: 1.0

  # Weak data-independent priors (logit scale)
  logit_rho_location: 0.0
  logit_rho_scale: 5.0

  logit_rho_l_location: 0.0
  logit_rho_l_scale: 5.0
  logit_rho_h_location: 0.0
  logit_rho_h_scale: 5.0
  w_rate: 0.5
  k0_location: 10.0
  k0_scale: 5.0

  logit_mu_location: 0.0
  logit_mu_scale: 5.0

  sampling:
    chains: 1
    iter_warmup: 500
    iter_sampling: 500
    adapt_delta: 0.95

sweep:
  K: [1, 2]
  stan_file: [
    "src/models/mixture_simple_contagion.stan",
    "src/models/mixture_complex_contagion.stan",
    "src/models/mixture_non_parametric.stan"
  ]
