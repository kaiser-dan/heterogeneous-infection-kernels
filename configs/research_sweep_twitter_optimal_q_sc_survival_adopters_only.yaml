# ============================================================================
# Survival Sweep - Twitter SC, adopters-only case analysis (K=1 only)
# ============================================================================
name: "research_sweep_twitter_optimal_q_sc_survival_adopters_only"

data_config: "configs/default_data_prep_survival.yaml"
source: "twitter"
twitter_mn_mode: "survival"
twitter_adopters_only: true
twitter_disable_ipw: true
wandb_enabled: false

q: 0.192
exposure_metric: "k"
kmax: 40

model:
  stan_file: "src/models/non_parametric_monotonic.stan"
  K: 1
  concentration: 1.0
  deviation_scale: 2.0
  logit_p_location: -7.8
  logit_p_scale: 1.5
  logit_rho_location: -8.8
  logit_rho_scale: 1.5
  logit_rho_l_location: -10.5
  logit_rho_l_scale: 1.0
  logit_rho_h_location: -7.8
  logit_rho_h_scale: 0.8
  w_rate: 2.0
  k0_location: 10.0
  k0_scale: 2.5
  V_max_local: 500

sweep:
  K: [1]
  stan_file: [
    "src/models/non_parametric_monotonic.stan",
    "src/models/model_simple_contagion.stan",
    "src/models/model_complex_contagion.stan"
  ]
