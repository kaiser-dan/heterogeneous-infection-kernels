name: "nonparam_survival_dense_20260325"
source: "synthetic"
wandb_enabled: false

synthetic:
  dataset_name: "nonparam_survival_dense_20260325"
  seed: 123
  kmax: 48
  graph:
    type: "sbm"
    params:
      n: 2048
      avg_degree: 18
      epsilon: 0.85
  contagion:
    gamma: 0.0
    tmax: 220
    dt: 1
    initial_infected: 0.08
    assignment:
      mode: "iid"
      probs: [1.0]
    kernels:
      - id: "k1"
        type: "nonparametric"
        values:
          [0.005, 0.006, 0.008, 0.015, 0.03, 0.06, 0.11, 0.18, 0.245, 0.295, 0.328, 0.35,
           0.366, 0.378, 0.388, 0.397, 0.405, 0.412, 0.418, 0.423, 0.427, 0.43, 0.433, 0.436,
           0.438, 0.44, 0.442, 0.444, 0.446, 0.448, 0.449, 0.45, 0.451, 0.452, 0.453, 0.454,
           0.455, 0.456, 0.457, 0.458, 0.459, 0.46, 0.461, 0.462, 0.463, 0.464, 0.465, 0.466]

model:
  stan_file: "src/models/non_parametric_monotonic_empirical_bayes.stan"
  K: 1
  concentration: 1.0
  deviation_scale: 1.0
  logit_p_location: "empirical"
  logit_p_scale: 2.0
  V_max_local: 10000
  sampling:
    chains: 1
    iter_warmup: 200
    iter_sampling: 200
    adapt_delta: 0.9
    max_treedepth: 12

sweep:
  K: [1]
  stan_file:
    - "src/models/model_simple_contagion.stan"
    - "src/models/model_complex_contagion.stan"
    - "src/models/non_parametric_monotonic_empirical_bayes.stan"

output:
  posterior_mode: "compact"

analysis:
  ppc:
    enabled: false
