name: cv_smoke_test
source: synthetic

synthetic:
  dataset_name: cv_smoke
  seed: 11
  kmax: 12
  graph:
    type: sbm
    params:
      n: 48
      avg_degree: 8
      epsilon: 0.7
  contagion:
    gamma: 0.1
    tmax: 80
    dt: 1
    initial_infected: 0.15
    assignment:
      mode: iid
      probs: [1.0]
    kernels:
      - id: k1
        type: simple
        beta: 0.08

cv_folds: 3

model:
  stan_file: src/models/non_parametric_monotonic.stan
  K: 1
  sampling:
    chains: 1
    iter_warmup: 100
    iter_sampling: 100

sweep:
  K: [1, 2]
  cv_fold: [0, 1, 2]
