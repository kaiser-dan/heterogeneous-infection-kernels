[project]
name = "hetker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arviz>=0.22.0",
    "cmdstanpy>=1.2.5",
    "ipykernel>=6.30.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.6",
    "netgraph>=4.13.2",
    "networkx>=3.5",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "patchworklib>=0.6.3",
    "plotnine>=0.15.0",
    "pyyaml>=6.0.3",
    "quarto>=0.1.0",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "statistics>=1.0.3.5",
]

[dependency-groups]
dev = [
    "isort>=6.0.1",
    "pytest>=8.4.2",
    "ruff>=0.13.2",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver2"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
