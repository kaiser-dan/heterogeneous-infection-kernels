[project]
name = "hetker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arviz>=0.22.0",
    "cmdstanpy>=1.2.5",
    "duckdb>=1.1.0",
    "fastparquet>=2025.12.0",
    "jupyter>=1.0.0",
    "jupyter-cache>=1.0.0",
    "loguru>=0.7.3",
    "nbclient>=0.10.0",
    "nbformat>=5.10.4",
    "networkx>=3.5",
    "numpy<2.0.0",
    "pandas>=2.3.2",
    "patchworklib>=0.6.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7.2",
    "statistics>=1.0.3.5",
    "snakemake>=8.0.0",
    "snakemake-executor-plugin-slurm>=0.2.1",
    "wandb>=0.19.0",
]

[dependency-groups]
dev = [
    "isort>=6.0.1",
    "pytest>=8.4.2",
    "ruff>=0.13.2",
]
viz = [
    "matplotlib>=3.10.6",
    "netgraph>=4.13.2",
    "seaborn>=0.13.2",
]
notebooks = [
    "ipykernel>=6.30.1",
    "jupyter-cache>=1.0.1",
    "quarto>=0.1.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver2"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
