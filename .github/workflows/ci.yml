name: CI

on:
  push:
    branches: ["main", "pr/**", "copilot/**"]
  pull_request:
    branches: ["main", "pr/**"]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Run unit tests
        run: uv run pytest -q --ignore=test/test_twitter_reproducibility.py

  snakemake-dryrun:
    name: Snakemake dry-run (synthetic)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Snakemake dry-run with synthetic config
        run: uv run snakemake inference --dry-run -c1 --configfile configs/research_sim_sweep_synthetic.yaml
